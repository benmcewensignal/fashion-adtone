  # a designer effect. Any control with a leadership change inside the window must be
  # moved to treated before freezing.
  - {id: hermes, name: Hermès, group: control, owner: Hermès, search_terms: ["Hermès"], page_ids: [], events: []}
  - {id: louis_vuitton, name: Louis Vuitton, group: control, owner: LVMH, search_terms: ["Louis Vuitton"], page_ids: [], events: []}
