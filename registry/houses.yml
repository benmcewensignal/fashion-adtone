# Panel for fashion-adtone v1. Reasoning is in SELECTION.md.
#
# status DRAFT: event dates are verified (5 October 2026); page ids are not yet confirmed.
# The first collect run picks each house's page automatically and records the picks in
# data/registry/page_candidates.json. Freeze by copying the right ids in here and setting
# status to FROZEN in a dated commit. After freezing, changes are a v2 panel, never edits.
#
# page_ids: the Facebook Page ids the house advertises from. Only fashion pages: a
# beauty or fragrance page run by the house or a licensee does not belong here.
# events: dates are the first show of the new creative director, checked on 5 October 2026
# against published fashion week schedules and show reports (sources in SELECTION.md).

version: 1
status: DRAFT

houses:
  # Treated: a creative director debut between July 2025 and February 2026, so the
  # one-year repository window can hold advertising from both sides.
  - id: chanel
    name: Chanel
    group: treated
    owner: Chanel
    search_terms: ["CHANEL"]
    page_ids: []
    events:
      - {kind: designer_debut, designer: Matthieu Blazy, date: 2025-10-06, verified: true}
  - id: dior
    name: Dior
    group: treated
    owner: LVMH
    search_terms: ["Dior"]
    page_ids: []
