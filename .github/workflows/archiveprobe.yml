name: archiveprobe
run-name: archiveprobe ${{ github.event_name }}
# What the Wayback Machine holds for two histories Focal lacks: the houses' pages on Google's Ads
# Transparency Center (Google keeps an ad only a year after it was last shown) and the houses' YouTube films
# (the Data API gives today's totals only). Counts captures and reads a few for the figures they carry;
# stores counts, dates and view figures, never a page or a picture. Run by hand. A second part lists the
# site's data calls the archive kept and opens a sample of them; a third counts the ad pages it saved,
# whose addresses name the advertiser, and how many saved calls came with one; a fourth asks for each of
# the houses' accounts on its own.
on:
  workflow_dispatch:
  push:   # editing .github/kick/archiveprobe starts a run
    branches: [main]
    paths: [".github/kick/archiveprobe"]

permissions:
  contents: write

concurrency:
  group: adtone-archiveprobe
  cancel-in-progress: false

jobs:
  archiveprobe:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        timeout-minutes: 5
        run: pip install -r requirements.txt
      - name: Probe the archive
        continue-on-error: true
        timeout-minutes: 45
        # a kick whose last line names the data calls, the ad pages or the house accounts runs only that part
        run: |
          if tail -n 1 .github/kick/archiveprobe | grep -qi "data calls"; then
            python -m adtone.archiveprobe calls --run "gh${GITHUB_RUN_ID}" --budget-min 30
          elif tail -n 1 .github/kick/archiveprobe | grep -qi "ad pages"; then
            python -m adtone.archiveprobe pages --run "gh${GITHUB_RUN_ID}" --budget-min 30
          elif tail -n 1 .github/kick/archiveprobe | grep -qi "house accounts"; then
            python -m adtone.archiveprobe accounts --run "gh${GITHUB_RUN_ID}" --budget-min 40
          elif tail -n 1 .github/kick/archiveprobe | grep -qi "country homepages"; then
            python -m adtone.archiveprobe homepages --run "gh${GITHUB_RUN_ID}" --budget-min 40
          else
            python -m adtone.archiveprobe run --run "gh${GITHUB_RUN_ID}"
          fi
      - name: Persist
        timeout-minutes: 10
        run: bash scripts/persist.sh archiveprobe "archiveprobe ${{ github.event_name }}"
