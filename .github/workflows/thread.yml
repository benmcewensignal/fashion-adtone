name: thread
run-name: thread ${{ inputs.mode || github.event_name }}
# The Thread (adtone/thread.py): every show of the panel's houses from 2015, with how much attention it drew
# and how the news wrote about it, each set against its season. build: heat and tone from the page views and
# press on file, for the shows in data/thread/shows.jsonl. calendar: try NOWFASHION's listings from here first;
# the site's bot check turns GitHub's machines away, so the calendar on file was read through Claude's
# fetcher and a failed fetch keeps it. looks: the probe of whether the houses' own sites, as the Wayback
# Machine holds them, carry a season's runway looks (adtone/looks.py; addresses and counts only, no picture
# kept). Weekly, after the attention and press runs; editing .github/kick/thread starts one, its first word the
# mode.
on:
  schedule:
    - cron: "50 6 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: build
        options: [build, calendar, looks]
  push:
    branches: [main]
    paths: [".github/kick/thread"]

permissions:
  contents: write

concurrency:
  group: adtone-thread
  cancel-in-progress: false

jobs:
  thread:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Mode
        id: m
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then mode=$(head -1 .github/kick/thread 2>/dev/null | awk '{print $1}'); fi
          case "$mode" in calendar|build|looks) ;; *) mode=build ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "thread mode: $mode"
      - name: Install
        timeout-minutes: 5
        run: pip install -q -r requirements.txt
      - name: The shows, from NOWFASHION's listings
        if: steps.m.outputs.mode == 'calendar'
        continue-on-error: true
        timeout-minutes: 15
        run: python -m adtone.thread calendar
      - name: Runway looks in the archive, one season
        if: steps.m.outputs.mode == 'looks'
        continue-on-error: true
        timeout-minutes: 26
        run: python -m adtone.looks probe --season "2026 SS" --budget-min 22
      - name: Heat and tone for every show
        continue-on-error: true
        timeout-minutes: 10
        run: python -m adtone.thread build
      - name: Persist
        if: always()
        timeout-minutes: 5
        run: bash scripts/persist.sh thread "thread ${{ steps.m.outputs.mode }}"
