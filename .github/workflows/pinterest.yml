name: pinterest
run-name: pinterest ${{ github.event_name }}
# Pinterest's Ads Repository (its ad library for the EU under the DSA), through its own public page in a
# headless browser: no account, no key, from the runner as it is. Weekly; the repository holds a year, so the history grows forward.
# Hourly as well while the first year is incomplete: the houses never searched to the end, then any pictures
# kept aside for the read stage (scripts/backfill_left.py); an hour with nothing left does nothing.
on:
  schedule:
    - cron: "5 8 * * 4"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      houses:
        description: "comma-separated house ids for a trial run (empty: all)"
        default: ""
      no_reader:
        description: "ads only; the pictures' addresses are kept for a later run with stage read"
        type: boolean
        default: false
      rematch:
        description: "match every house's advertisers again first; rows no longer the house's own are dropped"
        type: boolean
        default: false
      stage:
        description: "collect (the library) or read (the pictures kept aside by runs without the reader)"
        type: choice
        options: [collect, read]
        default: collect
      fresh:
        description: "search every house again, even one searched to the end this week"
        type: boolean
        default: false
  push:   # editing .github/kick/pinterest starts a run
    branches: [main]
    paths: [".github/kick/pinterest"]

permissions:
  contents: write

concurrency:
  group: adtone-pinterest
  cancel-in-progress: false

jobs:
  pinterest:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADTONE_CLAUDE_MODEL: ${{ vars.ADTONE_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      ADTONE_READER: ${{ vars.ADTONE_READER || 'modal' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        # the branch as it stands when the job starts, not the commit the run was queued at:
        # a run waiting behind another must see the outputs that one persisted
        with: { ref: "${{ github.ref_name }}" }
      - name: What the first year still lacks
        id: left
        run: |
          if [ "${{ github.event.schedule }}" = "35 * * * *" ]; then
            python3 scripts/backfill_left.py pinterest >> "$GITHUB_OUTPUT"
            echo "hourly=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.left.outputs.go == 'yes'
        with: { python-version: "3.12", cache: pip }
      - name: Install
        if: steps.left.outputs.go == 'yes'
        timeout-minutes: 15
        run: pip install -r requirements.txt -r requirements-embed.txt -r requirements-video.txt playwright && python -m playwright install --with-deps chromium
      - name: Cache embedder weights
        if: steps.left.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-openclip-vitb32-laion2b-v1
      - name: Collect ads
        if: steps.left.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 85
        run: |
          if [ "${{ steps.left.outputs.hourly }}" = "yes" ]; then
            # the clothes rubric is not read on advertisements until Amendment 3 is frozen (PREREGISTRATION-AMENDMENT-3.md)
            NC=""; if [ "${{ vars.ADS_CLOTHES }}" != "yes" ]; then NC="--no-clothes"; fi
            start=$SECONDS
            if [ "${{ steps.left.outputs.collect }}" = "yes" ]; then
              python -m adtone.pinterest collect --run "gh${GITHUB_RUN_ID}" --budget-min 70 --houses "${{ steps.left.outputs.houses }}" $NC || true
            fi
            left=$(( 75 - (SECONDS - start) / 60 ))
            if [ "${{ steps.left.outputs.read }}" = "yes" ] && [ "$left" -gt 5 ]; then
              python -m adtone.pinterest read --run "gh${GITHUB_RUN_ID}" --budget-min "$left" $NC || true
            fi
            left=$(( 75 - (SECONDS - start) / 60 ))
            # houses whose pictures were fetched but never read: searched again, once a day at most, and read
            if [ "${{ steps.left.outputs.collect }}" != "yes" ] && [ -n "${{ steps.left.outputs.fresh }}" ] && [ "$left" -gt 10 ]; then
              python -m adtone.pinterest collect --run "gh${GITHUB_RUN_ID}" --budget-min "$left" --fresh --houses "${{ steps.left.outputs.fresh }}" $NC || true
            fi
            exit 0
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.no_reader }}" = "true" ]; then EXTRA="--no-reader"; fi
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then EXTRA="$EXTRA --fresh"; fi
          if [ "${{ github.event.inputs.rematch }}" = "true" ]; then EXTRA="$EXTRA --rematch"; fi
          STAGE="${{ github.event.inputs.stage || 'collect' }}"
          # the clothes rubric is not read on advertisements until Amendment 3 is frozen (PREREGISTRATION-AMENDMENT-3.md)
          if [ "${{ vars.ADS_CLOTHES }}" != "yes" ]; then EXTRA="$EXTRA --no-clothes"; fi
          python -m adtone.pinterest "$STAGE" --run "gh${GITHUB_RUN_ID}" --budget-min 75 --houses "${{ github.event.inputs.houses }}" $EXTRA
      - name: Probe
        if: steps.left.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 3
        run: python -m adtone.pinterest probe --run "gh${GITHUB_RUN_ID}"
      - name: Persist
        if: steps.left.outputs.go == 'yes'
        timeout-minutes: 10
        run: bash scripts/persist.sh pinterest "pinterest ${{ github.event_name }}"
