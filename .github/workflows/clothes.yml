name: clothes
run-name: clothes ${{ inputs.mode || 'kick' }}
# The clothes rubric's test set (adtone/clothes.py; the rubric is rubric/clothes-v1.md).
# looks: runway looks from the collection pages the Wayback Machine keeps on the houses' own sites
#        (data/thread/looks_probe.json); copies for the reader to the private Modal volume, thumbnails for
#        the labelling page sealed to a key outside the repository and pushed to a branch of their own;
#        then the test set and the crops
# sample / crops: those steps alone
# seal: the 100 pictures to label, from the volume at a size a person can judge, sealed to the same branch
# testset: the test set drawn again from the looks on file, its crops, and the pictures to label sealed
# coverage: for every show since 2015, the house's own pages the archive holds from the fortnight after it
#        (adtone/looks.py; addresses only), resumed run by run
# auto (every three hours): coverage, then collect, each on half the budget, until both are complete
# collect: about twenty looks of every show the coverage map found pages for, copies to the private volume,
#        hashes and places to data/clothes/runway.jsonl; resumed run by run
# read:  the reader deployed at its pinned weights (data/luxury/readers.json), then every picture on the
#        volumes read with the frozen rubric (the test set first, then the runway looks, then the homepage
#        pictures) to data/clothes/readings.jsonl, resumed run by run; then judge
# judge: which questions stand (data/clothes/judge.json): rules 1 and 2 from the reader's answers on the
#        test set, rules 3 and 4 from data/clothes/labels.json once the labels are complete
# auto also reads the looks collected since the last reading once a hundred wait, then judges
# No picture is written to the repository. Editing .github/kick/clothes starts a run; its first word is the mode.
on:
  schedule:
    - cron: "20 1-22/3 * * *"   # every three hours until the coverage map and the collection are complete
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: looks
        options: [looks, sample, crops, seal, testset, coverage, collect, auto, read, judge]
  push:
    branches: [main]
    paths: [".github/kick/clothes"]

permissions:
  contents: write

concurrency:
  group: adtone-clothes
  cancel-in-progress: false

jobs:
  clothes:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Start from the latest main
        # a queued run starts after the run before it has persisted, so it reads that run's results
        run: git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD && git log --oneline -1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Mode
        id: m
        run: |
          mode="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then mode=auto; fi
          if [ -z "$mode" ]; then mode=$(head -1 .github/kick/clothes 2>/dev/null | awk '{print $1}'); fi
          case "$mode" in looks|sample|crops|seal|testset|coverage|collect|auto|read|judge) ;; *) mode=looks ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "clothes mode: $mode"
      - name: Install
        timeout-minutes: 10
        run: pip install -q -r requirements.txt pynacl
      - name: Which shows the archive holds pages for
        if: steps.m.outputs.mode == 'coverage' || steps.m.outputs.mode == 'auto'
        continue-on-error: true
        timeout-minutes: 55
        run: python -m adtone.looks coverage --budget-min $([ "${{ steps.m.outputs.mode }}" = auto ] && echo 25 || echo 45) --workers 4
      - name: About twenty looks of every show the archive holds, to the private volume
        if: steps.m.outputs.mode == 'collect' || steps.m.outputs.mode == 'auto'
        continue-on-error: true
        timeout-minutes: 60
        run: python -m adtone.clothes collect --budget-min $([ "${{ steps.m.outputs.mode }}" = auto ] && echo 25 || echo 45) --workers 4
      - name: Runway looks from the archive
        if: steps.m.outputs.mode == 'looks'
        timeout-minutes: 55
        run: python -m adtone.clothes looks --budget-min 40 --workers 4
      - name: Sealed thumbnails for the labelling page, on a branch of their own
        # One file sealed to a key that is not in this repository: it holds no readable picture.
        if: steps.m.outputs.mode == 'looks'
        timeout-minutes: 5
        run: |
          tmp=$(mktemp -d)
          cp clothes_pictures/thumbs.tar.sealed "$tmp/"
          cd "$tmp" && git init -q && git checkout -q -b clothes-sealed && git add thumbs.tar.sealed
          git -c user.name=adtone-clothes-bot -c user.email=actions@users.noreply.github.com commit -q -m "sealed thumbnails for the clothes labelling page"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" clothes-sealed
      - name: The test set
        if: steps.m.outputs.mode == 'looks' || steps.m.outputs.mode == 'sample' || steps.m.outputs.mode == 'testset'
        timeout-minutes: 5
        run: python -m adtone.clothes sample
      - name: The crops
        if: steps.m.outputs.mode == 'looks' || steps.m.outputs.mode == 'crops' || steps.m.outputs.mode == 'testset'
        timeout-minutes: 15
        run: python -m adtone.clothes crops
      - name: The pictures to label, sealed
        if: steps.m.outputs.mode == 'seal' || steps.m.outputs.mode == 'testset'
        timeout-minutes: 15
        run: python -m adtone.clothes seal
      - name: Sealed pictures to label, on a branch of their own
        # One file sealed to a key that is not in this repository: it holds no readable picture.
        if: steps.m.outputs.mode == 'seal' || steps.m.outputs.mode == 'testset'
        timeout-minutes: 5
        run: |
          tmp=$(mktemp -d)
          cp clothes_pictures/thumbs.tar.sealed "$tmp/"
          cd "$tmp" && git init -q && git checkout -q -b clothes-sealed && git add thumbs.tar.sealed
          git -c user.name=adtone-clothes-bot -c user.email=actions@users.noreply.github.com commit -q -m "sealed pictures for the clothes labelling page"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" clothes-sealed
      - name: Deploy the reader at its pinned weights
        if: steps.m.outputs.mode == 'read'
        timeout-minutes: 30
        run: |
          set -o pipefail
          q3=$(python -c "import json; print(json.load(open('data/luxury/readers.json'))['qwen3']['revision'])")
          test -n "$q3"
          BAKEOFF_MODEL=Qwen/Qwen3-VL-32B-Instruct-FP8 BAKEOFF_REVISION="$q3" BAKEOFF_APP=adtone-luxury-qwen3 BAKEOFF_GPU=H100 \
            BAKEOFF_CONTAINERS=4 BAKEOFF_SEQS=32 modal deploy bakeoff/modal_reader.py
      - name: Every picture on the volumes, read with the frozen rubric
        if: steps.m.outputs.mode == 'read'
        continue-on-error: true
        timeout-minutes: 80
        run: python -m adtone.clothes read --budget-min 65
      - name: The looks collected since the last reading, once a hundred wait
        if: steps.m.outputs.mode == 'auto'
        continue-on-error: true
        timeout-minutes: 30
        run: python -m adtone.clothes read --budget-min 20 --min-waiting 100
      - name: Which questions stand
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'judge' || steps.m.outputs.mode == 'auto'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m adtone.clothes judge
      - name: Persist
        if: always()
        timeout-minutes: 5
        run: bash scripts/persist.sh clothes "clothes ${{ steps.m.outputs.mode }}"
