name: backcat
run-name: backcat ${{ inputs.stage || github.event_name }}
# The back catalogue: campaigns from before the Meta repository's one-year window. models.com gives
# the crew, date and source page; the Wayback Machine gives the images from the houses' own sites.
# find: where the listing no longer links its source page, the page on the house's own site from the
# archive's index (addresses only; nothing is read). listings: discover, then find; nothing is read.
# images reads the pictures with the paid reader, so it runs only when started by hand (stage images or
# both: discover, find, then images); the daily run and a kick are listings runs.
on:
  schedule:
    - cron: "0 5 * * *"   # daily while some 4,000 campaigns wait to be listed and their pages found
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        default: listings
        options: [listings, both, discover, find, images]
      max_campaigns:
        description: "campaigns to fetch images for in this run"
        default: "150"
  push:   # editing .github/kick/backcat starts a listings run
    branches: [main]
    paths: [".github/kick/backcat"]

permissions:
  contents: write

concurrency:
  group: adtone-backcat
  cancel-in-progress: false

jobs:
  backcat:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 200
    env:
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADTONE_CLAUDE_MODEL: ${{ vars.ADTONE_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      ADTONE_READER: ${{ vars.ADTONE_READER || 'modal' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      STAGE: ${{ inputs.stage || 'listings' }}
      MAX: ${{ inputs.max_campaigns || '150' }}
    steps:
      - uses: actions/checkout@v4
        # the branch as it stands when the job starts, not the commit the run was queued at:
        # a run waiting behind another must see the outputs that one persisted
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        timeout-minutes: 15
        run: pip install -r requirements.txt -r requirements-embed.txt
      - name: Cache embedder weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-openclip-vitb32-laion2b-v1
      - name: Discover campaigns on models.com
        if: env.STAGE == 'both' || env.STAGE == 'discover' || env.STAGE == 'listings'
        id: discover
        continue-on-error: true
        timeout-minutes: 60
        run: python -m adtone.backcat discover --run "gh${GITHUB_RUN_ID}" --max "$MAX" --budget-min 50   # stops itself before the step's hour
      - name: Source pages on the houses' own sites, from the archive's index
        if: env.STAGE == 'both' || env.STAGE == 'find' || env.STAGE == 'listings'
        id: find
        continue-on-error: true
        timeout-minutes: 65
        run: python -m adtone.backcat find --run "gh${GITHUB_RUN_ID}" --max 300 --budget-min $([ "$STAGE" = find ] && echo 55 || echo 25)
      - name: Fetch archived images
        # read with the paid reader: only in a run started by hand for it (stage images or both)
        if: env.STAGE == 'both' || env.STAGE == 'images'
        id: images
        continue-on-error: true
        timeout-minutes: 100   # the stage stops itself at 90 minutes and saves what it has
        run: python -m adtone.backcat images --run "gh${GITHUB_RUN_ID}" --max "$MAX" --budget-min 90
      - name: Completeness probe
        timeout-minutes: 5
        run: python -m adtone.backcat probe --run "gh${GITHUB_RUN_ID}"
      - name: Persist
        timeout-minutes: 10
        run: bash scripts/persist.sh backcat "backcat $STAGE"
      - name: Fail if a stage failed
        if: steps.discover.outcome == 'failure' || steps.find.outcome == 'failure' || steps.images.outcome == 'failure'
        run: |
          echo "::error::a back-catalogue stage failed; progress before the failure was kept"
          exit 1
