name: attention
run-name: attention weekly
# Daily Wikipedia page views for every house: a consistent outside measure of attention, for the
# descriptive success analysis. Each run is a full refresh, so a missed week loses nothing. Then the
# same in nine more languages, with renamed articles joined to their old titles, and the houses'
# facts from Wikidata checked against the registry. Press tone has its own daily workflow (press.yml).
on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
  push:   # editing .github/kick/attention starts a run, for when the Actions page is out of reach
    branches: [main]
    paths: [".github/kick/attention"]

permissions:
  contents: write

concurrency:
  group: adtone-attention
  cancel-in-progress: false

jobs:
  attention:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        timeout-minutes: 5
        run: pip install -r requirements.txt
      - name: Collect page views
        id: collect
        continue-on-error: true
        timeout-minutes: 10
        run: python -m adtone.attention collect --run "gh${GITHUB_RUN_ID}"
      - name: Page views in ten languages
        id: langs
        continue-on-error: true
        timeout-minutes: 60
        # the first scan of redirects reads every former title's monthly views once; later weeks
        # refresh the daily series in a few minutes. It stops at its budget and resumes.
        run: python -m adtone.wikiviews collect --run "gh${GITHUB_RUN_ID}" --budget-min 50
      - name: Languages probe
        continue-on-error: true
        timeout-minutes: 2
        run: python -m adtone.wikiviews probe --run "gh${GITHUB_RUN_ID}"
      - name: Wikidata facts
        id: wikidata
        continue-on-error: true
        timeout-minutes: 5
        run: python -m adtone.wikidata collect --run "gh${GITHUB_RUN_ID}"
      - name: Completeness probe
        id: probe
        continue-on-error: true
        timeout-minutes: 2
        run: python -m adtone.attention probe --run "gh${GITHUB_RUN_ID}"
      - name: Persist
        timeout-minutes: 5
        run: bash scripts/persist.sh attention "attention weekly"
      - name: Fail if a step failed
        if: steps.collect.outcome == 'failure' || steps.probe.outcome == 'failure'
        run: |
          echo "::error::page-view collection or its probe failed; whatever was collected was kept"
          exit 1
