name: metaweb
run-name: metaweb ${{ github.event_name }}
# Meta's Ad Library as a data vendor reads it: an Apify actor's API, paid per ad. Each house's Facebook pages
# are found once by name and kept in the state for checking; their ads for the past year follow, in the row
# shape the official API's ads take. Weekly. Waits, recording that it waited, until APIFY_TOKEN exists.
# Hourly as well while the first year is incomplete: the houses never searched to the end, then the made
# pictures still waiting to be read (scripts/backfill_left.py); an hour with nothing left does nothing.
on:
  schedule:
    - cron: "15 8 * * 4"
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      houses:
        description: "comma-separated house ids for a trial run (empty: all)"
        default: ""
      no_reader:
        description: "ads only; the pictures' addresses are kept for a later run with stage read"
        type: boolean
        default: false
      rematch:
        description: "match every house's pages again first; rows of pages no longer kept are dropped"
        type: boolean
        default: false
      stage:
        description: "collect (the library) or read (the pictures kept aside by runs without the reader)"
        type: choice
        options: [collect, read]
        default: collect
      skip_dynamic:
        description: "read stage: the made fashion pictures first; the dynamic and catalogue units, and other divisions' ads, left for later"
        type: boolean
        default: true
      fresh:
        description: "search every house again, even one searched to the end this week"
        type: boolean
        default: false
      period:
        description: "the vendor's period: empty for the whole library, last30d for a top-up"
        default: ""
      countries:
        description: "the library's country filter for this run (empty: the META_COUNTRIES variable, default ALL)"
        default: ""
      max_ads:
        description: "ads per house for this run (empty: the META_MAX_ADS variable, default 2000)"
        default: ""
      form:
        description: "the address given to Apify's actor: library (the page's ads in the library) or page (the page's own address)"
        default: ""
      actor:
        description: "the actor for this run (empty: the META_ACTOR variable)"
        default: ""
  push:   # editing .github/kick/metaweb starts a run
    branches: [main]
    paths: [".github/kick/metaweb"]

permissions:
  contents: write

concurrency:
  group: adtone-metaweb
  cancel-in-progress: false

jobs:
  metaweb:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: "1"
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      META_ACTOR: ${{ github.event.inputs.actor || vars.META_ACTOR || 'curious_coder~facebook-ads-library-scraper' }}
      META_COUNTRIES: ${{ github.event.inputs.countries || vars.META_COUNTRIES || 'ALL' }}
      META_MAX_ADS: ${{ github.event.inputs.max_ads || vars.META_MAX_ADS || '2000' }}
      META_INPUT_FORM: ${{ github.event.inputs.form || vars.META_INPUT_FORM || 'library' }}
      # the weekly run asks the vendor for the last thirty days only (a house never searched to the end gets its whole
      # year whatever the period); the hourly backfill and a dispatched run without a period, the whole library
      META_PERIOD: ${{ github.event.schedule == '15 8 * * 4' && (vars.META_PERIOD || 'last30d') || github.event.inputs.period || '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADTONE_CLAUDE_MODEL: ${{ vars.ADTONE_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      ADTONE_READER: ${{ vars.ADTONE_READER || 'modal' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        # the branch as it stands when the job starts, not the commit the run was queued at:
        # a run waiting behind another must see the outputs that one persisted
        with: { ref: "${{ github.ref_name }}" }
      - name: What the first year still lacks
        id: left
        run: |
          if [ "${{ github.event.schedule }}" = "50 * * * *" ]; then
            python3 scripts/backfill_left.py metaweb >> "$GITHUB_OUTPUT"
            echo "hourly=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.left.outputs.go == 'yes'
        with: { python-version: "3.12", cache: pip }
      - name: Install
        if: steps.left.outputs.go == 'yes'
        timeout-minutes: 15
        run: |
          if [ -n "$APIFY_TOKEN" ]; then pip install -r requirements.txt -r requirements-embed.txt -r requirements-video.txt; else pip install -r requirements.txt; fi
      - name: Cache embedder weights
        if: env.APIFY_TOKEN != '' && steps.left.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-openclip-vitb32-laion2b-v1
      - name: Collect ads
        if: steps.left.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          if [ "${{ steps.left.outputs.hourly }}" = "yes" ]; then
            # the clothes rubric is not read on advertisements until Amendment 3 is frozen (PREREGISTRATION-AMENDMENT-3.md)
            NC=""; if [ "${{ vars.ADS_CLOTHES }}" != "yes" ]; then NC="--no-clothes"; fi
            start=$SECONDS
            if [ "${{ steps.left.outputs.collect }}" = "yes" ]; then
              python -m adtone.metaweb collect --run "gh${GITHUB_RUN_ID}" --budget-min 40 --no-reader --houses "${{ steps.left.outputs.houses }}" || true
            fi
            left=$(( 75 - (SECONDS - start) / 60 ))
            if [ "$left" -gt 5 ]; then
              python -m adtone.metaweb read --run "gh${GITHUB_RUN_ID}" --budget-min "$left" --skip-dynamic --fashion-only $NC || true
            fi
            exit 0
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.no_reader }}" = "true" ]; then EXTRA="--no-reader"; fi
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then EXTRA="$EXTRA --fresh"; fi
          if [ "${{ github.event.inputs.rematch }}" = "true" ]; then EXTRA="$EXTRA --rematch"; fi
          if [ "${{ github.event.inputs.skip_dynamic }}" != "false" ]; then EXTRA="$EXTRA --skip-dynamic --fashion-only"; fi
          STAGE="${{ github.event.inputs.stage || 'collect' }}"
          # the clothes rubric is not read on advertisements until Amendment 3 is frozen (PREREGISTRATION-AMENDMENT-3.md)
          if [ "${{ vars.ADS_CLOTHES }}" != "yes" ]; then EXTRA="$EXTRA --no-clothes"; fi
          python -m adtone.metaweb "$STAGE" --run "gh${GITHUB_RUN_ID}" --budget-min 75 --houses "${{ github.event.inputs.houses }}" $EXTRA
      - name: Probe
        if: env.APIFY_TOKEN != '' && steps.left.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 3
        run: python -m adtone.metaweb probe --run "gh${GITHUB_RUN_ID}"
      - name: Persist
        if: steps.left.outputs.go == 'yes'
        timeout-minutes: 10
        run: bash scripts/persist.sh metaweb "metaweb ${{ github.event_name }}"
