name: luxury
run-name: luxury ${{ inputs.mode || 'kick' }}
# Exploratory second reading of the homepage pictures as luxury pictures (adtone/luxury.py).
# fetch:  every homepage picture fetched again from the archive; copies for the readers to a private
#         Modal volume, pixel measures into the repository. Resumable: a second run picks up the rest.
# deploy: the open readers, deployed to read from the picture volume (pinned weights, recorded)
# bakeoff: deploy, then the bake-off's own readings taken through these readers (data/luxury/bakeoff/)
# read:   tone-v1 for every picture and every comparison of the design on the kept axes, both orders,
#         as data/luxury/plan.json says (written answers or probabilities), then positions
# check:  Claude reads a tenth of the pictures and a twentieth of the comparisons again
# embed:  the style models; analyse: adtone.readings on the new instrument (data/results/luxury.json)
# all:    deploy, read, check, embed, analyse. Every reading resumes where it stopped.
# v2:     deploy, then the new instrument (tone-v2, pairs-v2, composition-v1) on the bake-off's pictures,
#         judged by the rules frozen with it (data/luxury/bakeoff_v2.json); composition for every picture
# read-v2: deploy, then every picture on what went forward in v2 (data/luxury/plan-v2.json): tone-v2,
#         the kept axes' comparisons, positions, composition, and the readings (data/results/luxury-v2.json)
# Editing .github/kick/luxury starts a run; its first word is the mode.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: fetch
        options: [fetch, deploy, bakeoff, read, check, embed, analyse, all, v2, read-v2]
  push:
    branches: [main]
    paths: [".github/kick/luxury"]

permissions:
  contents: write

concurrency:
  group: adtone-luxury-v2
  cancel-in-progress: false

jobs:
  luxury:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADTONE_CLAUDE_MODEL: ${{ vars.ADTONE_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Start from the latest main
        # a queued run starts after the run before it has persisted, so it reads that run's results
        run: git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD && git log --oneline -1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Mode
        id: m
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then mode=$(head -1 .github/kick/luxury | awk '{print $1}'); fi
          case "$mode" in fetch|deploy|bakeoff|read|check|embed|analyse|all|v2|read-v2) ;; *) mode=fetch ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "luxury mode: $mode"
      - name: Install
        timeout-minutes: 10
        run: pip install -q -r requirements.txt

      - name: Fetch every homepage picture again
        if: steps.m.outputs.mode == 'fetch'
        timeout-minutes: 200
        run: set -o pipefail; python -m adtone.luxury fetch --budget 160 2>&1 | tee -a /tmp/luxury.log

      - name: Deploy the open readers to read from the picture volume
        if: steps.m.outputs.mode == 'deploy' || steps.m.outputs.mode == 'bakeoff' || steps.m.outputs.mode == 'all' || steps.m.outputs.mode == 'v2' || steps.m.outputs.mode == 'read-v2'
        timeout-minutes: 45
        run: |
          set -o pipefail
          q3=$(python -c "
          import json, pathlib
          for f in ('data/luxury/readers.json', 'data/bakeoff/readers.json'):
              p = pathlib.Path(f)
              if p.exists() and json.loads(p.read_text()).get('qwen3', {}).get('revision'):
                  print(json.loads(p.read_text())['qwen3']['revision']); break
          ")
          if [ -z "$q3" ]; then
            BAKEOFF_MODEL=Qwen/Qwen3-VL-32B-Instruct-FP8 BAKEOFF_APP=adtone-luxury-qwen3 modal run bakeoff/modal_reader.py 2>&1 | tee /tmp/pin3.log | tee -a /tmp/luxury.log
            q3=$(grep -o 'BAKEOFF_PIN .*' /tmp/pin3.log | sed 's/BAKEOFF_PIN //' | python -c "import json,sys; print(json.load(sys.stdin)['revision'])")
          fi
          q25=$(python -c "from adtone import config; print(config.open_model_revision())")
          python - "$q3" "$q25" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/luxury/readers.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          d["qwen3"] = {"model": "Qwen/Qwen3-VL-32B-Instruct-FP8", "revision": sys.argv[1], "gpu": "H100", "containers": 4, "app": "adtone-luxury-qwen3"}
          d["qwen25"] = {"model": "Qwen/Qwen2.5-VL-7B-Instruct", "revision": sys.argv[2], "gpu": "L4", "app": "adtone-luxury-qwen25"}
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(d, indent=1) + "\n")
          PY
          BAKEOFF_MODEL=Qwen/Qwen3-VL-32B-Instruct-FP8 BAKEOFF_REVISION="$q3" BAKEOFF_APP=adtone-luxury-qwen3 BAKEOFF_GPU=H100 \
            BAKEOFF_CONTAINERS=4 BAKEOFF_SEQS=32 modal deploy bakeoff/modal_reader.py 2>&1 | tee -a /tmp/luxury.log
          BAKEOFF_MODEL=Qwen/Qwen2.5-VL-7B-Instruct BAKEOFF_REVISION="$q25" BAKEOFF_APP=adtone-luxury-qwen25 BAKEOFF_GPU=L4 \
            BAKEOFF_CONTAINERS=1 BAKEOFF_SEQS=16 modal deploy bakeoff/modal_reader.py 2>&1 | tee -a /tmp/luxury.log
      - name: The bake-off's readings, through these readers
        if: steps.m.outputs.mode == 'bakeoff'
        continue-on-error: true
        timeout-minutes: 120
        run: |
          set -o pipefail
          python -m adtone.luxury bakeoff --reader qwen3 --what tone 2>&1 | tee -a /tmp/luxury.log
          python -m adtone.luxury bakeoff --reader qwen3 --what pairs 2>&1 | tee -a /tmp/luxury.log
          python -m adtone.luxury bakeoff --reader qwen25 --what human 2>&1 | tee -a /tmp/luxury.log
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m adtone.luxury bakeoff --reader claude --what tone 2>&1 | tee -a /tmp/luxury.log
            python -m adtone.luxury bakeoff --reader claude --what human 2>&1 | tee -a /tmp/luxury.log
          else
            echo "::notice::no Anthropic key; Claude is left out"
          fi
      - name: Does the reader know the brand, and the comparisons as probabilities
        if: steps.m.outputs.mode == 'bakeoff'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -o pipefail
          python -m adtone.luxury recognise --reader qwen3 2>&1 | tee -a /tmp/luxury.log
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m adtone.luxury recognise --reader claude 2>&1 | tee -a /tmp/luxury.log; fi
          python -m adtone.luxury probs --reader qwen3 2>&1 | tee -a /tmp/luxury.log
          python -m adtone.luxury bakeoff-report 2>&1 | tee -a /tmp/luxury.log
      - name: The new instrument on the bake-off's pictures
        if: steps.m.outputs.mode == 'v2'
        continue-on-error: true
        timeout-minutes: 150
        run: |
          set -o pipefail
          python -m adtone.luxury bakeoff --reader qwen3 --what tone --version tone-v2 2>&1 | tee -a /tmp/luxury.log || echo "::warning::tone-v2 stopped"
          python -m adtone.luxury probs --reader qwen3 --version pairs-v2 2>&1 | tee -a /tmp/luxury.log || echo "::warning::pairs-v2 stopped"
      - name: Composition from the pixels, the bake-off's pictures first
        if: steps.m.outputs.mode == 'v2'
        continue-on-error: true
        timeout-minutes: 90
        run: set -o pipefail; python -m adtone.luxury composition --budget 75 2>&1 | tee -a /tmp/luxury.log
      - name: The new instrument judged by the rules frozen with it
        if: steps.m.outputs.mode == 'v2'
        continue-on-error: true
        timeout-minutes: 20
        run: set -o pipefail; python -m adtone.luxury v2-report 2>&1 | tee -a /tmp/luxury.log
      - name: "v2: every picture, read on tone-v2"
        if: steps.m.outputs.mode == 'read-v2'
        continue-on-error: true
        timeout-minutes: 80
        run: set -o pipefail; python -m adtone.luxury read --reader qwen3 --what tone --instrument v2 --budget 70 2>&1 | tee -a /tmp/luxury.log
      - name: "v2: every comparison on the axes that went forward, both orders"
        if: steps.m.outputs.mode == 'read-v2'
        continue-on-error: true
        timeout-minutes: 140
        run: set -o pipefail; python -m adtone.luxury read --reader qwen3 --what comparisons --instrument v2 --budget 130 2>&1 | tee -a /tmp/luxury.log
      - name: "v2: positions, and composition for any picture not yet measured"
        if: steps.m.outputs.mode == 'read-v2'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -o pipefail
          python -m adtone.luxury positions --reader qwen3 --instrument v2 2>&1 | tee -a /tmp/luxury.log || echo "::warning::positions stopped"
          python -m adtone.luxury composition --budget 30 2>&1 | tee -a /tmp/luxury.log || echo "::warning::composition stopped"
      - name: "v2: the readings"
        if: steps.m.outputs.mode == 'read-v2'
        continue-on-error: true
        timeout-minutes: 45
        run: set -o pipefail; python -m adtone.luxury analyse --instrument v2 2>&1 | tee -a /tmp/luxury.log
      - name: Every picture, the registered questions
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 60
        run: set -o pipefail; python -m adtone.luxury read --reader qwen3 --what tone --budget 50 2>&1 | tee -a /tmp/luxury.log
      - name: Every comparison on the kept axes, both orders, as the plan says
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 200
        run: set -o pipefail; python -m adtone.luxury read --reader qwen3 --what comparisons --budget 180 2>&1 | tee -a /tmp/luxury.log
      - name: Positions on each axis
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 10
        run: set -o pipefail; python -m adtone.luxury positions --reader qwen3 2>&1 | tee -a /tmp/luxury.log
      - name: The standing check, read again by Claude
        if: steps.m.outputs.mode == 'check' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::no Anthropic key; no check"; exit 0; fi
          set -o pipefail; python -m adtone.luxury read --reader claude --what check --budget 80 2>&1 | tee -a /tmp/luxury.log
      - name: Style models
        if: steps.m.outputs.mode == 'embed' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          pip install -q -r requirements-bakeoff.txt
          for m in csd dino fashion; do python -m adtone.luxury embed --model "$m" 2>&1 | tee -a /tmp/luxury.log || echo "::warning::$m failed"; done
      - name: The readings on the new instrument
        if: steps.m.outputs.mode == 'analyse' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 90
        run: set -o pipefail; python -m adtone.luxury analyse 2>&1 | tee -a /tmp/luxury.log

      - name: Keep the end of the log
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          p = pathlib.Path("/tmp/luxury.log")
          lines = p.read_text(errors="replace").splitlines()[-300:] if p.exists() else []
          out = pathlib.Path("data/luxury/runlog.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({"at": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z", "lines": lines}, indent=0) + "\n")
          PY
      - name: Persist
        if: always()
        timeout-minutes: 10
        run: bash scripts/persist.sh luxury "luxury ${{ steps.m.outputs.mode }}"
