name: bakeoff
run-name: bakeoff ${{ inputs.mode || 'kick' }}
# Exploratory bake-off of readers and image models on about 300 homepage pictures (adtone/bakeoff.py).
# fetch: fetch the sampled pictures again; small copies to a private Modal volume, thumbnails sealed
#        for the judging page, pixel measures and the pairs design into the repository
# deploy: pin and deploy the open readers (Qwen3-VL-32B, and Qwen2.5-VL-7B for pairs)
# read / embed / score: the readings, the image models, the yardsticks; all: deploy, read, embed, score
# Editing .github/kick/bakeoff starts a run; its first word is the mode.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: all
        options: [fetch, deploy, read, embed, score, all]
  push:
    branches: [main]
    paths: [".github/kick/bakeoff"]

permissions:
  contents: write

concurrency:
  group: adtone-bakeoff
  cancel-in-progress: false

jobs:
  bakeoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADTONE_CLAUDE_MODEL: ${{ vars.ADTONE_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Mode
        id: m
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then mode=$(head -1 .github/kick/bakeoff | awk '{print $1}'); fi
          case "$mode" in fetch|deploy|read|embed|score|all) ;; *) mode=all ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "bake-off mode: $mode"
      - name: Install
        timeout-minutes: 10
        run: pip install -q -r requirements.txt pynacl

      - name: Fetch the pictures again
        if: steps.m.outputs.mode == 'fetch'
        timeout-minutes: 150
        run: |
          python -m adtone.bakeoff fetch
          python -m adtone.bakeoff pairs
      - name: Sealed thumbnails for the judging page
        if: steps.m.outputs.mode == 'fetch'
        timeout-minutes: 5
        run: |
          gh release view bakeoff-v1 >/dev/null 2>&1 || gh release create bakeoff-v1 --prerelease \
            --title "bake-off: sealed thumbnails" \
            --notes "One file sealed to a key that is not in this repository. It holds no readable pictures."
          gh release upload bakeoff-v1 bakeoff_pictures/thumbs.tar.sealed --clobber

      - name: Pin and deploy the open readers
        if: steps.m.outputs.mode == 'deploy' || steps.m.outputs.mode == 'all'
        timeout-minutes: 60
        run: |
          set -o pipefail
          q3=$(python -c "import json,pathlib; p=pathlib.Path('data/bakeoff/readers.json'); print(json.loads(p.read_text()).get('qwen3',{}).get('revision','') if p.exists() else '')")
          if [ -z "$q3" ]; then
            BAKEOFF_MODEL=Qwen/Qwen3-VL-32B-Instruct-FP8 BAKEOFF_APP=adtone-bakeoff-qwen3 modal run bakeoff/modal_reader.py | tee /tmp/pin3.log
            q3=$(grep -o 'BAKEOFF_PIN .*' /tmp/pin3.log | sed 's/BAKEOFF_PIN //' | python -c "import json,sys; print(json.load(sys.stdin)['revision'])")
          fi
          q25=$(python -c "from adtone import config; print(config.open_model_revision())")
          python - "$q3" "$q25" <<'EOF'
          import json, pathlib, sys
          p = pathlib.Path("data/bakeoff/readers.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          d["qwen3"] = {"model": "Qwen/Qwen3-VL-32B-Instruct-FP8", "revision": sys.argv[1], "gpu": "H100", "vllm": "0.11.0"}
          d["qwen25"] = {"model": "Qwen/Qwen2.5-VL-7B-Instruct", "revision": sys.argv[2], "gpu": "L4", "vllm": "0.11.0",
                         "note": "the registered weights, under a newer vLLM, used here for pairs only"}
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(d, indent=1) + "\n")
          EOF
          BAKEOFF_MODEL=Qwen/Qwen3-VL-32B-Instruct-FP8 BAKEOFF_REVISION="$q3" BAKEOFF_APP=adtone-bakeoff-qwen3 BAKEOFF_GPU=H100 modal deploy bakeoff/modal_reader.py
          BAKEOFF_MODEL=Qwen/Qwen2.5-VL-7B-Instruct BAKEOFF_REVISION="$q25" BAKEOFF_APP=adtone-bakeoff-qwen25 BAKEOFF_GPU=L4 modal deploy bakeoff/modal_reader.py

      - name: Qwen3-VL-32B, registered questions
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 40
        run: python -m adtone.bakeoff read --reader qwen3 --what tone
      - name: Qwen3-VL-32B, pairs
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 150
        run: python -m adtone.bakeoff read --reader qwen3 --what pairs
      - name: Qwen2.5-VL-7B, the person's pairs
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 30
        run: python -m adtone.bakeoff read --reader qwen25 --what human
      - name: Claude, registered questions and the person's pairs
        if: steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::no Anthropic key; Claude is left out"; exit 0; fi
          python -m adtone.bakeoff read --reader claude --what tone
          python -m adtone.bakeoff read --reader claude --what human

      - name: Image models
        if: steps.m.outputs.mode == 'embed' || steps.m.outputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          pip install -q -r requirements-bakeoff.txt
          for m in csd dino fashion; do python -m adtone.bakeoff embed --model "$m" || echo "::warning::$m failed"; done

      - name: Score
        if: steps.m.outputs.mode == 'score' || steps.m.outputs.mode == 'all' || steps.m.outputs.mode == 'read' || steps.m.outputs.mode == 'embed'
        continue-on-error: true
        timeout-minutes: 20
        run: python -m adtone.bakeoff score

      - name: Persist
        if: always()
        timeout-minutes: 10
        run: bash scripts/persist.sh bakeoff "bakeoff ${{ steps.m.outputs.mode }}"
